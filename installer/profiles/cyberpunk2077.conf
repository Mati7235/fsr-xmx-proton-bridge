# Cyberpunk 2077 profile for fsr-xmx.
# Values come from docs/installer-design.md, docs/xmx412-model-selection.md
# and from reading the game's bin/x64 folder (2026-11-22).
# Third-party files are NOT redistributed: the user provides them.

PROFILE_ID=cyberpunk2077
GAME_NAME=Cyberpunk 2077
GAME_EXE=Cyberpunk2077.exe
APPID=1091500

FSR4_DEFAULT=int8
FG_DEFAULT=xefg
PROVIDER_INT8=8
PROVIDER_LITE=12

# nitec's FSR4 XMX 4.1.2 mod (NexusMods; the user provides it).
MOD_DLL=amd_fidelityfx_upscaler_dx12.dll
MOD_SHA256=fadbcb50c523df01c9350747cc726edb4ecbf1a99e7ed629bf73cdbb37f44732
MOD_SIZE=45558272

# Official AMD 4.1.2 DLL that supplies the INT8/Lite weights.
FSR_ORIGINAL_DLL=fsr-original.dll
FSR_ORIGINAL_SHA256=aad4fccccb29084a655f9a4f9f613bd22c8c03fb4a0f8840148cc6543b4ccace
FSR_ORIGINAL_SIZE=57664272

# OptiScaler v10.0.0-pre_20261022 (official release, GPL).
OPTISCALER_DLL=dxgi.dll
OPTISCALER_INI=OptiScaler.ini
OPTISCALER_SHA256=df1380aa37fc17b26524e783f12ccb2f59cb67f966af13240bca3d4cd608a25a

# Official ANR FG V.B20 add-on (github.com/apex-compute/ANR).
ANR_SHA256=750885d982b0e58e815004da698999f3b85f20c84a28c33cc15ae54e555f70ae

IGDEXT_DLL=igdext64.dll
CABINET_DLL=cabinet.dll

VKD3D_DISABLE_EXTENSIONS=VK_EXT_descriptor_buffer,VK_EXT_descriptor_heap,VK_KHR_present_wait2
DLL_OVERRIDES=dxgi cabinet

# INI keys: section|key|value, separated by ';'.
INI_BASE=Upscalers|Dx12Upscaler|ffx;Spoofing|SpoofedVendorId|0x8086;Spoofing|SpoofedDeviceId|0xE20B;Spoofing|Dxgi|false;FSR|Fsr4GpuSupport|auto;FSR|Fsr4Preset|auto;FSR|Fsr4Model|auto
INI_FG_XEFG=FrameGen|Enabled|true;FrameGen|FGOutput|XeFG;FrameGen|FGInput|Upscaler;FrameGen|FGNvngxReplacement|auto;FrameGen|DisableHudless|auto
INI_FG_ANR=FrameGen|Enabled|true;FrameGen|FGOutput|XeFG;FrameGen|FGInput|nvngxfg;FrameGen|FGNvngxReplacement|Apex Neural Rendering FG;FrameGen|DisableHudless|false
